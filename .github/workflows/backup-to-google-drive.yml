name: Encrypted off-site backup

on:
  # GitHub Actions の cron は UTC。19:00 UTC = 毎日 04:00 JST。
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

# 同時実行で同一スナップショットを上書きしない。実行中のバックアップは中断しない。
concurrency:
  group: daida-encrypted-backup-${{ github.repository }}
  cancel-in-progress: false

# Gitの読み取りだけを許可。Google Drive/Supabaseは専用の外部資格情報で扱う。
permissions:
  contents: read

jobs:
  backup:
    environment: ${{ github.event_name == 'workflow_dispatch' && 'backup-manual' || 'backup-scheduled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      AGE_VERSION: '1.3.2'
      AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
      AGE_TARBALL_SHA256: 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10'
      # RCLONE_VERSION is reserved by rclone as the boolean --version flag.
      RCLONE_RELEASE_VERSION: '1.75.0'
      RCLONE_ZIP_SHA256: 'aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa'
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      GDRIVE_ROOT: ${{ vars.GDRIVE_BACKUP_ROOT || 'DAIDA-BACKUPS' }}
      GDRIVE_DAILY_RETENTION_DAYS: ${{ vars.GDRIVE_DAILY_RETENTION_DAYS || '35' }}
      GDRIVE_MONTHLY_RETENTION_DAYS: ${{ vars.GDRIVE_MONTHLY_RETENTION_DAYS || '400' }}
      GDRIVE_RESIDUAL_RISK_ACCEPTED: ${{ vars.GDRIVE_RESIDUAL_RISK_ACCEPTED }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_STORAGE_BUCKETS: ${{ vars.SUPABASE_STORAGE_BUCKETS }}
      BACKUP_STORAGE_ENABLED: ${{ vars.BACKUP_STORAGE_ENABLED || 'false' }}
      BACKUP_SNAPSHOT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SERVER_URL: ${{ github.server_url }}
      # PostgreSQL 17 official image. Pin the multi-platform manifest digest.
      POSTGRES_CLIENT_IMAGE: 'postgres:17.11-alpine3.23@sha256:06b0072465383084b1c18b6943260fc509c175a9e3f26752ba71362c1cd1d316'

    steps:
      - name: Check out backup scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install and verify age
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output age.tar.gz \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_TARBALL_SHA256}  age.tar.gz" | sha256sum --check --status
          tar -xzf age.tar.gz
          install -m 0755 age/age /usr/local/bin/age
          test "$(age --version)" = "v${AGE_VERSION}"
          rm -rf age age.tar.gz

      - name: Install and verify rclone
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="rclone-v${RCLONE_RELEASE_VERSION}-linux-amd64.zip"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://downloads.rclone.org/v${RCLONE_RELEASE_VERSION}/${archive}"
          echo "${RCLONE_ZIP_SHA256}  ${archive}" | sha256sum --check --status
          unzip -q "$archive"
          install -m 0755 "rclone-v${RCLONE_RELEASE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -n 1 | grep -Fxq "rclone v${RCLONE_RELEASE_VERSION}"
          rm -rf "$archive" "rclone-v${RCLONE_RELEASE_VERSION}-linux-amd64"

      - name: Pull pinned PostgreSQL client image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "$POSTGRES_CLIENT_IMAGE"

      - name: Check required runner tools
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v age
          command -v curl
          command -v docker
          command -v git
          command -v jq
          command -v openssl
          command -v rclone

      - name: Prepare least-privilege credential files
        shell: bash
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          BACKUP_SIGNING_PRIVATE_KEY: ${{ secrets.BACKUP_SIGNING_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s\n' "$SUPABASE_BACKUP_DB_URL" > "$RUNNER_TEMP/supabase-db-url"
          printf '%s\n' "$BACKUP_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/backup-signing.pem"
          chmod 600 "$RUNNER_TEMP/supabase-db-url" "$RUNNER_TEMP/backup-signing.pem"

      - name: Prepare Storage credential only when enabled
        if: env.BACKUP_STORAGE_ENABLED == 'true'
        shell: bash
        env:
          SUPABASE_STORAGE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          umask 077
          printf 'header = "Authorization: Bearer %s"\nheader = "apikey: %s"\n' "$SUPABASE_STORAGE_SERVICE_ROLE_KEY" "$SUPABASE_STORAGE_SERVICE_ROLE_KEY" > "$RUNNER_TEMP/storage-curl.conf"
          chmod 600 "$RUNNER_TEMP/storage-curl.conf"

      - name: Create encrypted snapshot and upload to Google Drive
        shell: bash
        env:
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ vars.GDRIVE_RCLONE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_RCLONE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
          SUPABASE_DB_URL_FILE: ${{ runner.temp }}/supabase-db-url
          SUPABASE_STORAGE_CURL_CONFIG: ${{ runner.temp }}/storage-curl.conf
          BACKUP_SIGNING_KEY_FILE: ${{ runner.temp }}/backup-signing.pem
        run: |
          chmod +x scripts/backup/*.sh
          scripts/backup/run-backup.sh

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/supabase-db-url" "$RUNNER_TEMP/storage-curl.conf" "$RUNNER_TEMP/backup-signing.pem"
